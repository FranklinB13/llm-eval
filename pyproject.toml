[project]
name = "llm-eval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bert-score>=0.3.13",
    "gradio>=6.13.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "python-dotenv>=1.2.2",
    "rouge-score>=0.1.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"